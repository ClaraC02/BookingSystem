<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>心理咨询预约系统</title>
  
  <!-- SheetJS 导出 Excel -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%);
      display: flex; justify-content: center; align-items: flex-start;
      min-height: 100vh; padding: 12px; -webkit-tap-highlight-color: transparent;
    }
    .app-container {
      width: 100%; max-width: 500px; background: #ffffff; border-radius: 28px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.06); padding: 20px 16px;
      display: flex; flex-direction: column; gap: 16px; margin: 8px 0;
    }
    h2 { font-size: 1.5rem; font-weight: 650; color: #0f172a; }
    h3 { font-size: 1rem; font-weight: 600; color: #334155; margin-bottom: 6px; }
    .role-badge {
      font-size: 0.8rem; background: linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 100%);
      color: #3730a3; padding: 5px 12px; border-radius: 18px; font-weight: 500;
    }
    .sync-status {
      font-size: 0.7rem; padding: 3px 8px; border-radius: 10px;
      background: #dcfce7; color: #166534; display: inline-flex; align-items: center; gap: 4px;
    }
    .sync-status.offline { background: #fee2e2; color: #991b1b; }
    button {
      font-family: inherit; font-size: 15px; min-height: 44px; border-radius: 12px;
      padding: 10px 16px; width: 100%; margin: 4px 0; font-weight: 600;
      cursor: pointer; border: none; transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
    .btn-danger { background: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }
    .btn-gray { background: #e5e7eb; color: #1f2937; border: 1px solid #d1d5db; }
    .btn-success { background: #10b981; color: white; }
    .btn-sm { min-height: 34px; padding: 6px 12px; font-size: 13px; width: auto; }
    input, select, textarea {
      font-family: inherit; font-size: 15px; min-height: 44px; border-radius: 12px;
      border: 1.5px solid #e2e8f0; padding: 8px 12px; background: #f9fafb;
      width: 100%; margin: 3px 0; transition: all 0.2s;box-sizing: border-box;
      -webkit-appearance: none; appearance: none; text-align: left;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: #667eea; background: #ffffff;
    }
    .custom-date-wrap {
      position: relative; flex: 1; min-width: 0;
    }
    .custom-date-wrap input[type="date"] {
      color: transparent; cursor: pointer; position: relative; z-index: 1;
      padding: 8px 12px; min-height: 44px; width: 100%; font-size: 15px;min-width: 0;
  box-sizing: border-box; -webkit-appearance: none; appearance: none;
  text-align: left; display: block;
    }
    .custom-date-wrap input[type="date"]:valid,
    .custom-date-wrap input[type="date"]:focus { color: #1e293b; }
    .custom-date-placeholder {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: #94a3b8; font-size: 15px; pointer-events: none; z-index: 0;
    }
    .custom-date-wrap input[type="date"]:valid ~ .custom-date-placeholder,
    .custom-date-wrap input[type="date"]:focus ~ .custom-date-placeholder { opacity: 0; }
    .card { background: #f8fafc; border-radius: 16px; padding: 14px; border: 1px solid #e9eef3; }
    .grid-list { display: flex; flex-direction: column; gap: 8px; max-height: 450px; overflow-y: auto; }
    .appointment-row {
      background: white; border-radius: 14px; padding: 12px 14px;
      border: 1px solid #e2e8f0; display: flex; flex-direction: column; gap: 6px;
    }
    .row-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
    .status-badge { font-size: 0.75rem; font-weight: 600; padding: 3px 10px; border-radius: 14px; white-space: nowrap; }
    .status-badge.wait { background: #dbeafe; color: #1e40af; }
    .status-badge.finish { background: #dcfce7; color: #166534; }
    .status-badge.cancel { background: #fee2e2; color: #991b1b; }
    .time-range { font-size: 0.8rem; color: #64748b; font-weight: 500; }
    .btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn-group button { flex: 1; min-width: 60px; }
    .inline-group { display: flex; gap: 6px; align-items: center; }
    .inline-group select { flex: 1; }
    .modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); display: flex; align-items: center;
      justify-content: center; z-index: 1000;
    }
    .modal-content {
      background: white; width: 92%; max-width: 420px; border-radius: 20px;
      padding: 20px; max-height: 85vh; overflow-y: auto;
    }
    .admin-table { background: white; border-radius: 14px; overflow: hidden; border: 1px solid #e2e8f0; }
    .table-header, .table-row {
      display: grid; grid-template-columns: 1.3fr 1fr 0.7fr 1fr;
      padding: 10px 8px; gap: 2px; font-size: 0.8rem; align-items: center;
    }
    .table-header { background: #f1f5f9; font-weight: 600; color: #475569; }
    .table-row { border-bottom: 1px solid #f1f5f9; }
    .section-divider { border-top: 2px dashed #e2e8f0; margin: 12px 0; padding-top: 12px; }
    .filter-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 6px; width: 100%; }
    .filter-row > * { flex: 1; min-width: 0; }
    .stat-badge { display: inline-block; padding: 2px 7px; border-radius: 8px; font-size: 0.7rem; font-weight: 600; margin-left: 3px; }
    .stat-wait { background: #dbeafe; color: #1e40af; }
    .stat-finish { background: #dcfce7; color: #166534; }
    .stat-cancel { background: #fee2e2; color: #991b1b; }
    .toast-container {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      z-index: 9999; display: flex; flex-direction: column; gap: 6px;
      pointer-events: none; width: 90%; max-width: 400px;
    }
    .toast {
      background: rgba(30,41,59,0.9); color: white;
      padding: 10px 20px; border-radius: 22px; font-size: 0.85rem;
      font-weight: 500; text-align: center;
      animation: toastIn 0.3s ease-out, toastOut 0.3s ease-in 1.8s forwards;
    }
    .toast.success { background: rgba(16,185,129,0.9); }
    .toast.error { background: rgba(220,38,38,0.9); }
    .toast.warning { background: rgba(245,158,11,0.9); }
    @keyframes toastIn { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes toastOut { from { opacity: 1; } to { opacity: 0; } }
    .date-display { font-weight: 600; color: #1e293b; font-size: 0.95rem; }
    .date-display .weekday { font-size: 0.75rem; color: #64748b; margin-left: 3px; }
    .loading {
      text-align: center; padding: 40px; color: #64748b;
    }
    .loading-spinner {
      display: inline-block; width: 40px; height: 40px;
      border: 3px solid #e2e8f0; border-top-color: #667eea;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="app-container" id="app">
  <div class="loading">
    <div class="loading-spinner"></div>
    <p style="margin-top:16px;">正在连接云端...</p>
    <p style="font-size:0.8rem;color:#94a3b8;">如果长时间未响应，将自动切换为离线模式</p>
  </div>
</div>
<div class="toast-container" id="toastContainer"></div>

<script>
// ==================== 先渲染基本界面，避免白屏 ====================
var appEl = document.getElementById('app');

// 显示加载状态
function showLoading(msg) {
  appEl.innerHTML = '<div class="loading"><div class="loading-spinner"></div><p style="margin-top:16px;">'+msg+'</p></div>';
}

// ==================== Firebase SDK 动态加载 ====================
var firebaseLoaded = false;
var db = null;

function loadFirebaseSDK() {
  return new Promise(function(resolve, reject) {
    // 如果已经加载过
    if (typeof firebase !== 'undefined' && firebase.firestore) {
      firebaseLoaded = true;
      resolve();
      return;
    }
    
    // 加载 app
    var script1 = document.createElement('script');
    script1.src = 'https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js';
    script1.onload = function() {
      // 加载 firestore
      var script2 = document.createElement('script');
      script2.src = 'https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js';
      script2.onload = function() {
        firebaseLoaded = true;
        resolve();
      };
      script2.onerror = function() {
        reject(new Error('Firestore SDK 加载失败'));
      };
      document.head.appendChild(script2);
    };
    script1.onerror = function() {
      reject(new Error('Firebase SDK 加载失败'));
    };
    document.head.appendChild(script1);
  });
}

// ==================== 本地存储（离线备用） ====================
var DB_KEYS = {
  users: 'local_users',
  consultants: 'local_consultants',
  appointments: 'local_appointments',
  profiles: 'local_profiles'
};

function localGet(key) {
  return JSON.parse(localStorage.getItem(key) || '[]');
}

function localSet(key, data) {
  localStorage.setItem(key, JSON.stringify(data));
}

function initLocalData() {
  if(!localStorage.getItem(DB_KEYS.users)) {
    localSet(DB_KEYS.users, [{username:'user1',password:'123456',remaining:5}]);
  }
  if(!localStorage.getItem(DB_KEYS.consultants)) {
    localSet(DB_KEYS.consultants, [
      {id:'c1',account:'wang01',name:'王咨询师',intro:'情绪管理',password:'123456'},
      {id:'c2',account:'li01',name:'李咨询师',intro:'家庭关系',password:'123456'},
      {id:'c3',account:'zhang01',name:'张咨询师',intro:'职业规划',password:'123456'}
    ]);
  }
  if(!localStorage.getItem(DB_KEYS.appointments)) {
    localSet(DB_KEYS.appointments, []);
  }
  if(!localStorage.getItem(DB_KEYS.profiles)) {
    localSet(DB_KEYS.profiles, []);
  }
}

// ==================== 数据操作 ====================
var cachedUsers = [];
var cachedConsultants = [];
var cachedAppointments = [];
var cachedProfiles = [];
var isOnline = false;

function loadLocalData() {
  cachedUsers = localGet(DB_KEYS.users);
  cachedConsultants = localGet(DB_KEYS.consultants);
  cachedAppointments = localGet(DB_KEYS.appointments);
  cachedProfiles = localGet(DB_KEYS.profiles);
}

function saveLocalData() {
  localSet(DB_KEYS.users, cachedUsers);
  localSet(DB_KEYS.consultants, cachedConsultants);
  localSet(DB_KEYS.appointments, cachedAppointments);
  localSet(DB_KEYS.profiles, cachedProfiles);
}

async function loadCloudData() {
  var snapshot = await db.collection('users').get();
  cachedUsers = snapshot.docs.map(function(doc){ return doc.data(); });
  if(cachedUsers.length === 0) {
    // 云端无数据，初始化
    await db.collection('users').add({username:'user1',password:'123456',remaining:5});
    await db.collection('consultants').add({id:'c1',account:'wang01',name:'王咨询师',intro:'情绪管理',password:'123456'});
    await db.collection('consultants').add({id:'c2',account:'li01',name:'李咨询师',intro:'家庭关系',password:'123456'});
    await db.collection('consultants').add({id:'c3',account:'zhang01',name:'张咨询师',intro:'职业规划',password:'123456'});
    snapshot = await db.collection('users').get();
    cachedUsers = snapshot.docs.map(function(doc){ return doc.data(); });
  }
  
  snapshot = await db.collection('consultants').get();
  cachedConsultants = snapshot.docs.map(function(doc){ return doc.data(); });
  
  snapshot = await db.collection('appointments').get();
  cachedAppointments = snapshot.docs.map(function(doc){ return doc.data(); });
  
  snapshot = await db.collection('profiles').get();
  cachedProfiles = snapshot.docs.map(function(doc){ return doc.data(); });
  
  // 同步到本地
  saveLocalData();
}

async function saveCloudData(collection, data) {
  var snapshot = await db.collection(collection).get();
  var batch = db.batch();
  snapshot.docs.forEach(function(doc){ batch.delete(doc.ref); });
  await batch.commit();
  for(var i=0; i<data.length; i++) {
    await db.collection(collection).add(data[i]);
  }
  saveLocalData();
}

// ==================== 工具函数 ====================
function toast(msg, type) {
  var c = document.getElementById('toastContainer');
  var t = document.createElement('div');
  t.className = 'toast ' + (type || '');
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(function(){ if(t.parentNode) t.remove(); }, 2200);
}

function fmtDate(d) {
  if(!d) return '';
  var dt = new Date(d + 'T00:00:00');
  var w = ['周日','周一','周二','周三','周四','周五','周六'];
  return (dt.getMonth()+1) + '月' + dt.getDate() + '日 <span class="weekday">' + w[dt.getDay()] + '</span>';
}

function today() { return new Date().toISOString().split('T')[0]; }

function slots(date) {
  var r = []; var n = new Date(); var isT = date === today();
  for(var h=9; h<20; h++) {
    for(var m=0; m<60; m+=30) {
      var t = String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
      var eh = h + Math.floor((m+60)/60), em = (m+60)%60;
      var et = String(eh).padStart(2,'0') + ':' + String(em).padStart(2,'0');
      if(isT && (h*60+m) <= (n.getHours()*60+n.getMinutes())) continue;
      r.push({ v:t, l:t + ' - ' + et });
    }
  }
  return r;
}

function endTime(t) {
  var p = t.split(':').map(Number);
  var eh = p[0] + Math.floor((p[1]+60)/60), em = (p[1]+60)%60;
  return String(eh).padStart(2,'0') + ':' + String(em).padStart(2,'0');
}

function conflict(cid, date, time, exId) {
  var p = time.split(':').map(Number);
  var ns = p[0]*60+p[1], ne = ns+60;
  return cachedAppointments.some(function(a) {
    if(a.consultantId !== cid || a.date !== date || a.id === exId) return false;
    if(a.status === 'cancel' || a.status === 'finish') return false;
    var ep = a.time.split(':').map(Number);
    var es = ep[0]*60+ep[1], ee = es+60;
    return ns < ee && ne > es;
  });
}

function autoDone() {
  var n = new Date(); var td = today(); var ch = false;
  cachedAppointments = cachedAppointments.map(function(a) {
    if(a.status !== 'wait') return a;
    var h = parseInt(a.time.split(':')[0]);
    if(a.date < td || (a.date === td && n.getHours()*60+n.getMinutes() >= (h+1)*60)) {
      ch = true; return Object.assign({}, a, {status:'finish'});
    }
    return a;
  });
  if(ch) saveData();
}

async function saveData() {
  if(isOnline) {
    await saveCloudData('users', cachedUsers);
    await saveCloudData('consultants', cachedConsultants);
    await saveCloudData('appointments', cachedAppointments);
    await saveCloudData('profiles', cachedProfiles);
  } else {
    saveLocalData();
  }
}

function retRem(u) {
  var idx = cachedUsers.findIndex(function(x){return x.username===u;});
  if(idx!==-1){ cachedUsers[idx].remaining++; saveData(); return true; }
  return false;
}

function decRem(u) {
  var idx = cachedUsers.findIndex(function(x){return x.username===u;});
  if(idx!==-1 && cachedUsers[idx].remaining>0){ cachedUsers[idx].remaining--; saveData(); return true; }
  return false;
}

function profOpts(profs, sel) {
  var h = '<option value="">选择档案(可选)</option>';
  profs.forEach(function(p) { h += '<option value="'+p.id+'" '+(p.id===sel?'selected':'')+'>'+p.name+' '+p.phone+'</option>'; });
  h += '<option value="__new__" style="color:#667eea;font-weight:600;">➕ 新增档案...</option>';
  return h;
}

var STORAGE_CURRENT = 'psy_current';
function getCur() { return JSON.parse(localStorage.getItem(STORAGE_CURRENT)); }
function setCur(v) { localStorage.setItem(STORAGE_CURRENT, JSON.stringify(v)); }
function logout() { localStorage.removeItem(STORAGE_CURRENT); renderLogin(); }

var DRAFT_KEY = 'psy_draft';
function saveDraft(d) { localStorage.setItem(DRAFT_KEY, JSON.stringify(d)); }
function getDraft() { return JSON.parse(localStorage.getItem(DRAFT_KEY) || '{}'); }
function clearDraft() { localStorage.removeItem(DRAFT_KEY); }

function updateSyncStatus() {
  var el = document.getElementById('syncStatus');
  if(el) {
    el.className = 'sync-status' + (isOnline ? '' : ' offline');
    el.innerHTML = isOnline ? '🟢 云端同步' : '🔴 离线模式';
  }
}

// ==================== 登录 ====================
function renderLogin() {
  appEl.innerHTML = 
    '<div style="text-align:center;margin-top:16px;"><h2>🧠 心理咨询预约系统</h2><p style="color:#64748b;font-size:0.9rem;">'+(isOnline?'云端数据 · 多设备同步':'离线模式 · 数据存本地')+'</p></div>' +
    '<input id="lu" placeholder="用户名"><input id="lp" type="password" placeholder="密码">' +
    '<button class="btn-primary" id="loginBtn">登 录</button>' +
    '<p style="font-size:0.75rem;color:#94a3b8;text-align:center;margin-top:10px;">我们共同成长</p>';
  
  document.getElementById('loginBtn').onclick = function() {
    var u = document.getElementById('lu').value.trim();
    var p = document.getElementById('lp').value.trim();
    if(!u || !p) { toast('请输入用户名和密码', 'warning'); return; }
    if(u === 'admin' && p === 'admin123') { setCur({role:'admin'}); renderAdmin(); return; }
    var c = cachedConsultants.find(function(x){return x.account===u&&x.password===p;});
    if(c) { setCur({role:'consultant', id:c.id, name:c.name}); renderConsultant(); return; }
    var us = cachedUsers.find(function(x){return x.username===u&&x.password===p;});
    if(us) { setCur({role:'visitor', username:us.username}); renderVisitor(); return; }
    toast('账号或密码错误', 'error');
  };
}

// ==================== 来访者 ====================
function renderVisitor() {
  autoDone();
  var cu = getCur();
  var us = cachedUsers.find(function(u){return u.username===cu.username;});
  if(!us) { logout(); return; }
  var profs = cachedProfiles.filter(function(p){return p.owner===cu.username;});
  var myApps = cachedAppointments.filter(function(a){return a.visitor===cu.username;});
  var draft = getDraft();
  var sd = draft.date || today(), sc = draft.consultantId || '', st = draft.time || '';
  var sn = draft.note || '', sp = draft.profileId || (profs.length===1?profs[0].id:'');

  appEl.innerHTML = 
    '<div style="display:flex;justify-content:space-between;align-items:center;"><h2>📅 我的预约</h2><span class="role-badge">剩余'+us.remaining+'次</span></div>' +
    '<span class="sync-status" id="syncStatus">'+(isOnline?'🟢 云端同步':'🔴 离线模式')+'</span>' +
    '<div class="card"><h3>新建预约</h3>' +
    '<input type="date" id="ad" min="'+today()+'" value="'+sd+'">' +
    '<select id="at"><option>选时段</option>'+slots(sd).map(function(x){return '<option value="'+x.v+'" '+(x.v===st?'selected':'')+'>'+x.l+'</option>';}).join('')+'</select>' +
    '<select id="ac"><option>选咨询师</option>'+cachedConsultants.map(function(x){return '<option value="'+x.id+'" '+(x.id===sc?'selected':'')+'>'+x.name+'</option>';}).join('')+'</select>' +
    '<div class="inline-group"><select id="ap" style="flex:1;">'+profOpts(profs,sp)+'</select></div>' +
    '<textarea id="an" placeholder="备注" rows="2">'+sn+'</textarea>' +
    '<button class="btn-primary" id="submit" '+(us.remaining<=0?'disabled':'')+'>'+(us.remaining<=0?'次数用完':'✅ 确认预约')+'</button></div>' +
    '<h3>待咨询</h3><div id="waitList" class="grid-list"></div>' +
    '<div class="btn-group"><button class="btn-gray" id="recBtn">记录</button><button class="btn-gray" id="profBtn">档案</button><button class="btn-gray" id="ctrBtn">个人</button></div>' +
    '<button class="btn-danger" id="outBtn">退出</button>';

  function scd() {
    saveDraft({ date: document.getElementById('ad').value, time: document.getElementById('at').value, consultantId: document.getElementById('ac').value, profileId: document.getElementById('ap').value, note: document.getElementById('an').value });
  }
  document.getElementById('ad').onchange = function(){ document.getElementById('at').innerHTML='<option>选时段</option>'+slots(this.value).map(function(x){return '<option value="'+x.v+'">'+x.l+'</option>';}).join(''); scd(); };
  document.getElementById('at').onchange=scd; document.getElementById('ac').onchange=scd; document.getElementById('an').oninput=scd;
  document.getElementById('ap').onchange = function(){ if(this.value==='__new__'){ scd(); renderProfileManager(); } else scd(); };

  var waitApps = myApps.filter(function(a){return a.status==='wait';});
  document.getElementById('waitList').innerHTML = waitApps.length===0?
    '<p style="color:#94a3b8;text-align:center;padding:16px;">暂无待咨询预约</p>' :
    waitApps.map(function(a){
      var c = cachedConsultants.find(function(x){return x.id===a.consultantId;});

      var u=document.getElementById('afu').value,c=document.getElementById('afco').value,s=document.getElementById('afs2').value,df=document.getElementById('afdf').value,dt=document.getElementById('afdt').value; 
      if(u)f=f.filter(function(a){return a.visitor===u;}); if(c)f=f.filter(function(a){return a.consultantId===c;}); if(s)f=f.filter(function(a){return a.status===s;}); if(df)f=f.filter(function(a){return a.date>=df;}); if(dt)f=f.filter(function(a){return a.date<=dt;}); 
      f.forEach(function(a){var co=cachedConsultants.find(function(x){return x.id===a.consultantId;});data.push({日期:a.date,时段:a.time+'-'+endTime(a.time),来访者:a.visitor,咨询师:co?co.name:'',状态:a.status==='wait'?'待':a.status==='finish'?'完':'取消'});}); 
      var ws=XLSX.utils.json_to_sheet(data); var wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'全部预约'); XLSX.writeFile(wb,'全部预约_'+today()+'.xlsx'); toast('导出成功','success'); 
    };
    rf(); document.getElementById('back').onclick = renderAdmin;
  };
  document.getElementById('lo').onclick = logout;
}

// 管理员全局函数
window.eu = function(un) {
  var u=cachedUsers.find(function(x){return x.username===un;});
  var nt=prompt('修改剩余预约次数',u.remaining); if(nt===null)return;
  u.remaining=parseInt(nt)||0; saveData(); toast('修改成功','success'); renderAdmin();
};
window.du = function(un) {
  if(!confirm('删除？')) return;
  cachedUsers = cachedUsers.filter(function(u){return u.username!==un;});
  saveData(); toast('已删除','success'); renderAdmin();
};
window.ec = function(id) {
  var c=cachedConsultants.find(function(x){return x.id===id;});
  var na=prompt('账号',c.account); if(na===null)return;
  var nn=prompt('姓名',c.name); if(nn===null)return;
  c.account=na; c.name=nn; saveData(); toast('修改成功','success'); renderAdmin();
};
window.dc = function(id) {
  if(!confirm('删除？')) return;
  cachedConsultants = cachedConsultants.filter(function(c){return c.id!==id;});
  saveData(); toast('已删除','success'); renderAdmin();
};
window.ae = function(id) {
  var a=cachedAppointments.find(function(x){return x.id===id;});
  var modal=document.createElement('div'); modal.className='modal';
  modal.innerHTML = '<div class="modal-content"><h3>编辑</h3><p>'+fmtDate(a.date)+' '+a.time+'-'+endTime(a.time)+'</p><select id="aes"><option value="wait" '+(a.status==='wait'?'selected':'')+'>待</option><option value="finish">完</option><option value="cancel">取消</option></select><div class="btn-group"><button class="btn-primary" id="aesv">保存</button><button class="btn-gray" id="aecl">取消</button></div></div>';
  document.body.appendChild(modal);
  document.getElementById('aecl').onclick = function(){modal.remove();};
  document.getElementById('aesv').onclick = function(){
    var old=a.status, nw=document.getElementById('aes').value;
    a.status=nw; saveData();
    if(old==='wait'&&nw==='cancel'){ retRem(a.visitor); toast('已取消返还','success'); }
    modal.remove();
    if(document.getElementById('afl')) document.getElementById('alb').onclick();
    else document.getElementById('ab').onclick();
  };
};
window.af = function(id) {
  if(!confirm('标记完成？')) return;
  var a=cachedAppointments.find(function(x){return x.id===id;});
  if(a){a.status='finish'; saveData(); toast('已完成','success');}
  if(document.getElementById('afl')) document.getElementById('alb').onclick();
  else document.getElementById('ab').onclick();
};
window.acx = function(id) {
  if(!confirm('确定取消？返还次数。')) return;
  var a=cachedAppointments.find(function(x){return x.id===id;});
  if(a&&a.status==='wait'){ a.status='cancel'; saveData(); retRem(a.visitor); toast('已取消返还','success'); }
  if(document.getElementById('afl')) document.getElementById('alb').onclick();
  else document.getElementById('ab').onclick();
};

// ==================== 启动 ====================
async function startApp() {
  showLoading('正在连接云端...');
  
  // 先加载本地数据
  initLocalData();
  loadLocalData();
  
  // 尝试加载Firebase
  try {
    await Promise.race([
      loadFirebaseSDK(),
      new Promise(function(_, reject) {
        setTimeout(function() { reject(new Error('加载超时')); }, 5000);
      })
    ]);
    
    // Firebase加载成功，初始化
    firebase.initializeApp({
      apiKey: "AIzaSyANlkglFhrlWhucVOvsH-olqotoHN-E4NQ",
      authDomain: "psy-consulting.firebaseapp.com",
      projectId: "psy-consulting",
      storageBucket: "psy-consulting.firebasestorage.app",
      messagingSenderId: "132180312320",
      appId: "1:132180312320:web:443b75555c1b3c5c6cf3e5"
    });
    db = firebase.firestore();
    
    // 尝试加载云端数据
    try {
      await loadCloudData();
      isOnline = true;
    } catch(e) {
      console.log('云端连接失败，使用本地数据:', e.message);
      isOnline = false;
      loadLocalData();
    }
  } catch(e) {
    console.log('Firebase SDK加载失败，使用离线模式:', e.message);
    isOnline = false;
    loadLocalData();
  }
  
  // 渲染界面
  autoDone();
  var currentUser = getCur();
  if(currentUser) {
    if(currentUser.role === 'visitor') renderVisitor();
    else if(currentUser.role === 'consultant') renderConsultant();
    else if(currentUser.role === 'admin') renderAdmin();
  } else {
    renderLogin();
  }
}

startApp();
</script>
