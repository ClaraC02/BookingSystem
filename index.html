<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>心理咨询预约系统</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%);
      display: flex; justify-content: center; align-items: flex-start;
      min-height: 100vh; padding: 12px; -webkit-tap-highlight-color: transparent;
    }
    .app-container {
      width: 100%; max-width: 500px; background: #ffffff; border-radius: 28px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.06); padding: 20px 16px;
      display: flex; flex-direction: column; gap: 16px; margin: 8px 0;
    }
    h2 { font-size: 1.5rem; font-weight: 650; color: #0f172a; }
    h3 { font-size: 1rem; font-weight: 600; color: #334155; margin-bottom: 6px; }
    .role-badge {
      font-size: 0.8rem; background: linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 100%);
      color: #3730a3; padding: 5px 12px; border-radius: 18px; font-weight: 500;
    }
    button {
      font-family: inherit; font-size: 15px; min-height: 44px; border-radius: 12px;
      padding: 10px 16px; width: 100%; margin: 4px 0; font-weight: 600;
      cursor: pointer; border: none; transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    button:active { transform: scale(0.97); }
    .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
    .btn-danger { background: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }
    .btn-gray { background: #e5e7eb; color: #1f2937; border: 1px solid #d1d5db; }
    .btn-success { background: #10b981; color: white; }
    .btn-sm { min-height: 34px; padding: 6px 12px; font-size: 13px; width: auto; }
    input, select, textarea {
      font-family: inherit; font-size: 15px; min-height: 44px; border-radius: 12px;
      border: 1.5px solid #e2e8f0; padding: 8px 12px; background: #f9fafb;
      width: 100%; margin: 3px 0; transition: all 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: #667eea; background: #ffffff;
    }
    .custom-date-wrap {
      position: relative; flex: 1; min-width: 0;
    }
    .custom-date-wrap input[type="date"] {
      color: transparent; cursor: pointer; position: relative; z-index: 1;
      padding: 8px 30px 8px 12px; min-height: 44px; width: 100%; font-size: 15px;
    }
    .custom-date-wrap input[type="date"]:valid,
    .custom-date-wrap input[type="date"]:focus { color: #1e293b; }
    .custom-date-wrap input[type="date"]::-webkit-calendar-picker-indicator {
      position: absolute; right: 8px; z-index: 2; cursor: pointer; width: 20px; height: 20px;
    }
    .custom-date-wrap input[type="date"]::-webkit-datetime-edit-text,
    .custom-date-wrap input[type="date"]::-webkit-datetime-edit-month-field,
    .custom-date-wrap input[type="date"]::-webkit-datetime-edit-day-field,
    .custom-date-wrap input[type="date"]::-webkit-datetime-edit-year-field { color: transparent; }
    .custom-date-wrap input[type="date"]:valid::-webkit-datetime-edit-text,
    .custom-date-wrap input[type="date"]:valid::-webkit-datetime-edit-month-field,
    .custom-date-wrap input[type="date"]:valid::-webkit-datetime-edit-day-field,
    .custom-date-wrap input[type="date"]:valid::-webkit-datetime-edit-year-field,
    .custom-date-wrap input[type="date"]:focus::-webkit-datetime-edit-text,
    .custom-date-wrap input[type="date"]:focus::-webkit-datetime-edit-month-field,
    .custom-date-wrap input[type="date"]:focus::-webkit-datetime-edit-day-field,
    .custom-date-wrap input[type="date"]:focus::-webkit-datetime-edit-year-field { color: #1e293b; }
    .custom-date-placeholder {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: #94a3b8; font-size: 15px; pointer-events: none; z-index: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: calc(100% - 40px);
    }
    .custom-date-wrap input[type="date"]:valid ~ .custom-date-placeholder,
    .custom-date-wrap input[type="date"]:focus ~ .custom-date-placeholder { opacity: 0; }
    .card { background: #f8fafc; border-radius: 16px; padding: 14px; border: 1px solid #e9eef3; }
    .grid-list { display: flex; flex-direction: column; gap: 8px; max-height: 450px; overflow-y: auto; }
    .appointment-row {
      background: white; border-radius: 14px; padding: 12px 14px;
      border: 1px solid #e2e8f0; display: flex; flex-direction: column; gap: 6px;
    }
    .row-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
    .status-badge { font-size: 0.75rem; font-weight: 600; padding: 3px 10px; border-radius: 14px; white-space: nowrap; }
    .status-badge.wait { background: #dbeafe; color: #1e40af; }
    .status-badge.finish { background: #dcfce7; color: #166534; }
    .status-badge.cancel { background: #fee2e2; color: #991b1b; }
    .time-range { font-size: 0.8rem; color: #64748b; font-weight: 500; }
    .btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn-group button { flex: 1; min-width: 60px; }
    .inline-group { display: flex; gap: 6px; align-items: center; }
    .inline-group select { flex: 1; }
    .modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); display: flex; align-items: center;
      justify-content: center; z-index: 1000; backdrop-filter: blur(4px);
    }
    .modal-content {
      background: white; width: 92%; max-width: 420px; border-radius: 20px;
      padding: 20px; max-height: 85vh; overflow-y: auto;
      box-shadow: 0 20px 50px rgba(0,0,0,0.2);
      animation: modalIn 0.2s ease-out;
    }
    @keyframes modalIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    .admin-table { background: white; border-radius: 14px; overflow: hidden; border: 1px solid #e2e8f0; }
    .table-header, .table-row {
      display: grid; grid-template-columns: 1.3fr 1fr 0.7fr 1fr;
      padding: 10px 8px; gap: 2px; font-size: 0.8rem; align-items: center;
    }
    .table-header { background: #f1f5f9; font-weight: 600; color: #475569; }
    .table-row { border-bottom: 1px solid #f1f5f9; }
    .section-divider { border-top: 2px dashed #e2e8f0; margin: 12px 0; padding-top: 12px; }
    .warning-text { color: #dc2626; font-size: 0.8rem; margin-top: 2px; }
    .filter-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 6px; width: 100%; }
    .filter-row > * { flex: 1; min-width: 0; }
    .filter-row > select { min-width: 80px; }
    .stat-badge { display: inline-block; padding: 2px 7px; border-radius: 8px; font-size: 0.7rem; font-weight: 600; margin-left: 3px; }
    .stat-wait { background: #dbeafe; color: #1e40af; }
    .stat-finish { background: #dcfce7; color: #166534; }
    .stat-cancel { background: #fee2e2; color: #991b1b; }
    .toast-container {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      z-index: 9999; display: flex; flex-direction: column; gap: 6px;
      pointer-events: none; width: 90%; max-width: 400px;
    }
    .toast {
      background: rgba(30,41,59,0.9); color: white;
      padding: 10px 20px; border-radius: 22px; font-size: 0.85rem;
      font-weight: 500; text-align: center; backdrop-filter: blur(8px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.18);
      animation: toastIn 0.3s ease-out, toastOut 0.3s ease-in 1.8s forwards;
    }
    .toast.success { background: rgba(16,185,129,0.9); }
    .toast.error { background: rgba(220,38,38,0.9); }
    .toast.warning { background: rgba(245,158,11,0.9); }
    @keyframes toastIn { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes toastOut { from { opacity: 1; } to { opacity: 0; } }
    .date-display { font-weight: 600; color: #1e293b; font-size: 0.95rem; }
    .date-display .weekday { font-size: 0.75rem; color: #64748b; margin-left: 3px; }
  </style>
</head>
<body>
<div class="app-container" id="app"></div>
<div class="toast-container" id="toastContainer"></div>

<script>
(function() {
  var DB = { u:'psy_1', c:'psy_2', a:'psy_3', p:'psy_4', cur:'psy_5', draft:'psy_6' };

  function toast(msg, type) {
    var c = document.getElementById('toastContainer');
    var t = document.createElement('div');
    t.className = 'toast ' + (type || '');
    t.textContent = msg;
    c.appendChild(t);
    setTimeout(function(){ if(t.parentNode) t.remove(); }, 2200);
  }

  function fmtDate(d) {
    if(!d) return '';
    var dt = new Date(d + 'T00:00:00');
    var w = ['周日','周一','周二','周三','周四','周五','周六'];
    return (dt.getMonth()+1) + '月' + dt.getDate() + '日 <span class="weekday">' + w[dt.getDay()] + '</span>';
  }

  function today() { return new Date().toISOString().split('T')[0]; }
  function g(k) { return JSON.parse(localStorage.getItem(k) || '[]'); }
  function s(k, v) { localStorage.setItem(k, JSON.stringify(v)); }
  function getCur() { return JSON.parse(localStorage.getItem(DB.cur)); }
  function setCur(v) { localStorage.setItem(DB.cur, JSON.stringify(v)); }
  function logout() { localStorage.removeItem(DB.cur); renderLogin(); }

  function init() {
    if(!localStorage.getItem(DB.u)) s(DB.u, [{ username:'user1', password:'123456', remaining:5 }]);
    if(!localStorage.getItem(DB.c)) s(DB.c, [
      { id:'c1', account:'wang01', name:'王咨询师', intro:'情绪管理', password:'123456' },
      { id:'c2', account:'li01', name:'李咨询师', intro:'家庭关系', password:'123456' },
      { id:'c3', account:'zhang01', name:'张咨询师', intro:'职业规划', password:'123456' }
    ]);
    if(!localStorage.getItem(DB.a)) s(DB.a, []);
    if(!localStorage.getItem(DB.p)) s(DB.p, []);
  }

  function slots(date) {
    var r = []; var n = new Date(); var isT = date === today();
    for(var h=9; h<20; h++) {
      for(var m=0; m<60; m+=30) {
        var t = String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
        var eh = h + Math.floor((m+60)/60), em = (m+60)%60;
        var et = String(eh).padStart(2,'0') + ':' + String(em).padStart(2,'0');
        if(isT && (h*60+m) <= (n.getHours()*60+n.getMinutes())) continue;
        r.push({ v:t, l:t + ' - ' + et });
      }
    }
    return r;
  }

  function endTime(t) {
    var p = t.split(':').map(Number);
    var eh = p[0] + Math.floor((p[1]+60)/60), em = (p[1]+60)%60;
    return String(eh).padStart(2,'0') + ':' + String(em).padStart(2,'0');
  }

  function conflict(cid, date, time, exId) {
    var p = time.split(':').map(Number);
    var ns = p[0]*60+p[1], ne = ns+60;
    return g(DB.a).some(function(a) {
      if(a.consultantId !== cid || a.date !== date || a.id === exId) return false;
      if(a.status === 'cancel' || a.status === 'finish') return false;
      var ep = a.time.split(':').map(Number);
      var es = ep[0]*60+ep[1], ee = es+60;
      return ns < ee && ne > es;
    });
  }

  function autoDone() {
    var apps = g(DB.a); var n = new Date(); var td = today(); var ch = false;
    var up = apps.map(function(a) {
      if(a.status !== 'wait') return a;
      var h = parseInt(a.time.split(':')[0]);
      if(a.date < td || (a.date === td && n.getHours()*60+n.getMinutes() >= (h+1)*60)) {
        ch = true; return Object.assign({}, a, {status:'finish'});
      }
      return a;
    });
    if(ch) s(DB.a, up);
  }

  function retRem(u) { var us=g(DB.u); var ur=us.find(function(x){return x.username===u;}); if(ur){ur.remaining++;s(DB.u,us);return true;} return false; }
  function decRem(u) { var us=g(DB.u); var ur=us.find(function(x){return x.username===u;}); if(ur&&ur.remaining>0){ur.remaining--;s(DB.u,us);return true;} return false; }

  function profOpts(profs, sel) {
    var h = '<option value="">选择档案(可选)</option>';
    profs.forEach(function(p) { h += '<option value="' + p.id + '" ' + (p.id===sel?'selected':'') + '>' + p.name + ' ' + p.phone + '</option>'; });
    h += '<option value="__new__" style="color:#667eea;font-weight:600;">➕ 新增档案...</option>';
    return h;
  }

  function saveDraft(d) { s(DB.draft, d); }
  function getDraft() { return JSON.parse(localStorage.getItem(DB.draft) || '{}'); }
  function clearDraft() { localStorage.removeItem(DB.draft); }

  // ===== 登录 =====
  function renderLogin() {
    document.getElementById('app').innerHTML = 
      '<div style="text-align:center;margin-top:16px;"><h2>🧠 心理咨询预约</h2><p style="color:#64748b;font-size:0.9rem;">全功能管理平台</p></div>' +
      '<input id="lu" placeholder="用户名"><input id="lp" type="password" placeholder="密码">' +
      '<button class="btn-primary" id="loginBtn">登 录</button>' +
      '<p style="font-size:0.75rem;color:#94a3b8;text-align:center;margin-top:10px;">admin/admin123 | user1/123456 | wang01/123456</p>';
    document.getElementById('loginBtn').onclick = function() {
      var u = document.getElementById('lu').value.trim();
      var p = document.getElementById('lp').value.trim();
      if(!u || !p) { toast('请输入用户名和密码', 'warning'); return; }
      if(u === 'admin' && p === 'admin123') { setCur({role:'admin'}); renderAdmin(); return; }
      var c = g(DB.c).find(function(x){return x.account===u&&x.password===p;});
      if(c) { setCur({role:'consultant', id:c.id, name:c.name}); renderConsultant(); return; }
      var us = g(DB.u).find(function(x){return x.username===u&&x.password===p;});
      if(us) { setCur({role:'visitor', username:us.username}); renderVisitor(); return; }
      toast('账号或密码错误', 'error');
    };
  }

  // ===== 来访者 =====
  function renderVisitor() {
    autoDone(); var cu = getCur();
    var us = g(DB.u).find(function(u){return u.username===cu.username;});
    if(!us) { logout(); return; }
    var profs = g(DB.p).filter(function(p){return p.owner===cu.username;});
    var myApps = g(DB.a).filter(function(a){return a.visitor===cu.username;});
    var draft = getDraft();
    var sd = draft.date || today(), sc = draft.consultantId || '', st = draft.time || '';
    var sn = draft.note || '', sp = draft.profileId || (profs.length===1?profs[0].id:'');

    document.getElementById('app').innerHTML = 
      '<div style="display:flex;justify-content:space-between;align-items:center;"><h2>📅 我的预约</h2><span class="role-badge">剩余'+us.remaining+'次</span></div>' +
      '<div class="card"><h3>新建预约</h3>' +
      '<input type="date" id="ad" min="'+today()+'" value="'+sd+'">' +
      '<select id="at"><option>选时段</option>'+slots(sd).map(function(x){return '<option value="'+x.v+'" '+(x.v===st?'selected':'')+'>'+x.l+'</option>';}).join('')+'</select>' +
      '<select id="ac"><option>选咨询师</option>'+g(DB.c).map(function(x){return '<option value="'+x.id+'" '+(x.id===sc?'selected':'')+'>'+x.name+'</option>';}).join('')+'</select>' +
      '<div class="inline-group"><select id="ap" style="flex:1;">'+profOpts(profs,sp)+'</select></div>' +
      '<textarea id="an" placeholder="备注" rows="2">'+sn+'</textarea>' +
      '<button class="btn-primary" id="submit" '+(us.remaining<=0?'disabled':'')+'>'+(us.remaining<=0?'次数用完':'✅ 确认预约')+'</button></div>' +
      '<h3>待咨询</h3><div id="waitList" class="grid-list"></div>' +
      '<div class="btn-group"><button class="btn-gray" id="recBtn">记录</button><button class="btn-gray" id="profBtn">档案</button><button class="btn-gray" id="ctrBtn">个人</button></div>' +
      '<button class="btn-danger" id="outBtn">退出</button>';

    function scd() {
      var d = {
        date: document.getElementById('ad')?document.getElementById('ad').value:'',
        time: document.getElementById('at')?document.getElementById('at').value:'',
        consultantId: document.getElementById('ac')?document.getElementById('ac').value:'',
        profileId: document.getElementById('ap')?document.getElementById('ap').value:'',
        note: document.getElementById('an')?document.getElementById('an').value:''
      };
      if(d.profileId==='__new__') d.profileId='';
      saveDraft(d);
    }

    document.getElementById('ad').onchange = function() {
      document.getElementById('at').innerHTML = '<option>选时段</option>' + slots(this.value).map(function(x){return '<option value="'+x.v+'">'+x.l+'</option>';}).join('');
      scd();
    };
    document.getElementById('at').onchange = scd;
    document.getElementById('ac').onchange = scd;
    document.getElementById('an').oninput = scd;
    document.getElementById('ap').onchange = function() {
      if(this.value==='__new__') { scd(); renderProfileManager(); }
      else scd();
    };

    function sw() {
      var w = myApps.filter(function(a){return a.status==='wait';});
      document.getElementById('waitList').innerHTML = w.length===0?
        '<p style="color:#94a3b8;text-align:center;padding:16px;">暂无待咨询预约</p>' :
        w.map(function(a){
          var c = g(DB.c).find(function(x){return x.id===a.consultantId;});
          return '<div class="appointment-row"><div class="row-top"><div><span class="date-display">'+fmtDate(a.date)+'</span><div class="time-range">'+a.time+'-'+endTime(a.time)+'</div></div><span class="status-badge wait">待咨询</span></div><div>'+(c?c.name:'未知')+' | '+(a.profileName||'')+'</div><button class="btn-gray" onclick="window._reschedule(\''+a.id+'\')">✏️ 改签</button></div>';
        }).join('');
    }
    sw();

    document.getElementById('submit').onclick = function() {
      var d=document.getElementById('ad').value, t=document.getElementById('at').value;
      var cid=document.getElementById('ac').value, pid=document.getElementById('ap').value;
      var note=document.getElementById('an').value;
      if(!d||!t||!cid){toast('请填写完整','warning');return;}
      if(pid==='__new__'){toast('请先选择档案','warning');return;}
      if(conflict(cid,d,t)){toast('时段冲突','error');return;}
      var p=profs.find(function(x){return x.id===pid;});
      var apps=g(DB.a);
      apps.push({id:Date.now().toString(),visitor:cu.username,consultantId:cid,date:d,time:t,profileName:p?p.name+' '+p.phone:'',note:note,status:'wait'});
      s(DB.a,apps); decRem(cu.username); clearDraft();
      toast('预约成功','success'); renderVisitor();
    };

    document.getElementById('recBtn').onclick = function() {
      var apps = g(DB.a).filter(function(a){return a.visitor===cu.username;});
      document.getElementById('app').innerHTML = 
        '<h2>📋 记录</h2><div class="grid-list">' +
        apps.map(function(a){
          var c = g(DB.c).find(function(x){return x.id===a.consultantId;});
          var st = a.status==='wait'?'待':a.status==='finish'?'完':'取消';
          return '<div class="appointment-row"><div class="row-top"><div><span class="date-display">'+fmtDate(a.date)+'</span><div class="time-range">'+a.time+'-'+endTime(a.time)+'</div></div><span class="status-badge '+a.status+'">'+st+'</span></div><div>'+(c?c.name:'未知')+' | '+(a.profileName||'')+'</div>'+(a.status==='wait'?'<button class="btn-danger" onclick="window._cancelApp(\''+a.id+'\')">取消(返还)</button>':'')+'</div>';
        }).join('') +
        '</div><button class="btn-gray" id="back">←返回</button>';
      document.getElementById('back').onclick = renderVisitor;
    };

    document.getElementById('profBtn').onclick = function() { scd(); renderProfileManager(); };
    document.getElementById('ctrBtn').onclick = function() {
      document.getElementById('app').innerHTML = 
        '<h2>⚙️ 个人</h2><div class="card"><p>'+us.username+' 剩余'+us.remaining+'次</p></div>' +
        '<button class="btn-primary" id="chPwd">修改密码</button><button class="btn-gray" id="back">←返回</button>';
      document.getElementById('chPwd').onclick = function() {
        var old=prompt('旧密码'); if(old!==us.password){toast('旧密码错误','error');return;}
        var n1=prompt('新密码(≥4位)'); if(!n1||n1.length<4){toast('至少4位','warning');return;}
        var uss=g(DB.u); uss.find(function(u){return u.username===cu.username;}).password=n1;
        s(DB.u,uss); toast('修改成功','success'); logout();
      };
      document.getElementById('back').onclick = renderVisitor;
    };
    document.getElementById('outBtn').onclick = function() { clearDraft(); logout(); };
  }

  function renderProfileManager() {
    var cu = getCur();
    document.getElementById('app').innerHTML = 
      '<h2>👤 档案管理</h2><div class="card"><input id="pName" placeholder="姓名"><input id="pPhone" placeholder="手机"><textarea id="pNote" placeholder="备注" rows="2"></textarea><button class="btn-primary" id="addP">➕ 新增</button></div><div class="grid-list" id="pList"></div><button class="btn-gray" id="back">← 返回</button>';

    function rl() {
      var profs = g(DB.p).filter(function(p){return p.owner===cu.username;});
      document.getElementById('pList').innerHTML = profs.length===0?
        '<p style="color:#94a3b8;text-align:center;padding:16px;">暂无档案</p>' :
        profs.map(function(p){

            var co = ac.find(function(x){return x.id===a.consultantId;});
            var st = a.status==='wait'?'待':a.status==='finish'?'完':'取消';
            return '<div class="appointment-row"><div class="row-top"><div><span class="date-display">'+fmtDate(a.date)+'</span><div class="time-range">'+a.time+'-'+endTime(a.time)+'</div></div><span class="status-badge '+a.status+'">'+st+'</span></div><div>'+a.visitor+' | '+(co?co.name:'')+' | '+(a.profileName||'')+'</div><div class="btn-group"><button class="btn-gray btn-sm" onclick="window._ae(\''+a.id+'\')">编辑</button>'+(a.status==='wait'?'<button class="btn-primary btn-sm" onclick="window._af(\''+a.id+'\')">完成</button><button class="btn-danger btn-sm" onclick="window._acx(\''+a.id+'\')">取消</button>':'')+'</div></div>';
          }).join('');
      }

      document.getElementById('afu').onchange = rf;
      document.getElementById('afco').onchange = rf;
      document.getElementById('afs2').onchange = rf;
      document.getElementById('afdf').onchange = rf;
      document.getElementById('afdt').onchange = rf;

      document.getElementById('afr').onclick = function() {
        document.getElementById('afu').value=''; document.getElementById('afco').value='';
        document.getElementById('afs2').value=''; document.getElementById('afdf').value=''; document.getElementById('afdt').value='';
        var phs = document.querySelectorAll('.custom-date-placeholder');
        for(var i=0; i<phs.length; i++) phs[i].style.opacity = '1';
        rf();
      };

      document.getElementById('afe').onclick = function() {
        var data = getF().map(function(a){
          var co = ac.find(function(x){return x.id===a.consultantId;});
          return {日期:a.date, 时段:a.time+'-'+endTime(a.time), 来访者:a.visitor, 咨询师:co?co.name:'', 档案:a.profileName||'', 状态:a.status==='wait'?'待':a.status==='finish'?'完':'取消', 备注:a.note||''};
        });
        var ws = XLSX.utils.json_to_sheet(data);
        var wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, '全部预约');
        XLSX.writeFile(wb, '全部预约_'+today()+'.xlsx');
        toast('导出成功','success');
      };

      rf();
      document.getElementById('back').onclick = renderAdmin;
    };

    document.getElementById('lo').onclick = logout;
  }

  // 管理员全局函数
  window._eu = function(un) {
    var u = g(DB.u).find(function(x){return x.username===un;}); if(!u) return;
    var modal = document.createElement('div'); modal.className='modal';
    modal.innerHTML = '<div class="modal-content"><h3>编辑 '+un+'</h3><p>密码</p><input id="eup" value="'+u.password+'"><p>次数</p><input id="eut" type="number" value="'+u.remaining+'" min="0"><div class="btn-group"><button class="btn-primary" id="eus">保存</button><button class="btn-gray" id="euc">取消</button></div></div>';
    document.body.appendChild(modal);
    document.getElementById('euc').onclick = function(){modal.remove();};
    document.getElementById('eus').onclick = function() {
      var np=document.getElementById('eup').value, nt=parseInt(document.getElementById('eut').value)||0;
      var us=g(DB.u); var ur=us.find(function(x){return x.username===un;});
      ur.password=np; ur.remaining=nt; s(DB.u,us);
      modal.remove(); toast('修改成功','success');
      if(document.getElementById('ub')) document.getElementById('ub').onclick();
    };
  };

  window._du = function(un) {
    if(!confirm('删除 '+un+'？')) return;
    s(DB.u, g(DB.u).filter(function(u){return u.username!==un;}));
    toast('已删除','success'); renderAdmin();
  };

  window._ec = function(id) {
    var c = g(DB.c).find(function(x){return x.id===id;}); if(!c) return;
    var modal = document.createElement('div'); modal.className='modal';
    modal.innerHTML = '<div class="modal-content"><h3>编辑咨询师</h3><p>账号</p><input id="eca" value="'+c.account+'"><p>姓名</p><input id="ecn" value="'+c.name+'"><p>简介</p><input id="eci" value="'+(c.intro||'')+'"><p>密码</p><input id="ecp" value="'+c.password+'"><div class="btn-group"><button class="btn-primary" id="ecs">保存</button><button class="btn-gray" id="ecc">取消</button></div></div>';
    document.body.appendChild(modal);
    document.getElementById('ecc').onclick = function(){modal.remove();};
    document.getElementById('ecs').onclick = function() {
      var na=document.getElementById('eca').value.trim(), nn=document.getElementById('ecn').value.trim();
      if(!na||!nn){toast('不能为空','warning');return;}
      var cs=g(DB.c);
      if(cs.some(function(x){return x.account===na&&x.id!==id;})){toast('账号重复','error');return;}
      var co=cs.find(function(x){return x.id===id;});
      co.account=na; co.name=nn; co.intro=document.getElementById('eci').value; co.password=document.getElementById('ecp').value;
      s(DB.c,cs); modal.remove(); toast('修改成功','success');
      if(document.getElementById('cb')) document.getElementById('cb').onclick();
    };
  };

  window._dc = function(id) {
    if(!confirm('删除？')) return;
    s(DB.c, g(DB.c).filter(function(c){return c.id!==id;}));
    toast('已删除','success'); renderAdmin();
  };

  window._ae = function(id) {
    var app = g(DB.a).find(function(a){return a.id===id;}); if(!app) return;
    var modal = document.createElement('div'); modal.className='modal';
    modal.innerHTML = '<div class="modal-content"><h3>编辑</h3><p>'+fmtDate(app.date)+' '+app.time+'-'+endTime(app.time)+'</p><textarea id="aen">'+(app.note||'')+'</textarea><select id="aes"><option value="wait" '+(app.status==='wait'?'selected':'')+'>待</option><option value="finish" '+(app.status==='finish'?'selected':'')+'>完</option><option value="cancel" '+(app.status==='cancel'?'selected':'')+'>取消</option></select><p class="warning-text">取消返还1次</p><div class="btn-group"><button class="btn-primary" id="aesv">保存</button><button class="btn-gray" id="aecl">取消</button></div></div>';
    document.body.appendChild(modal);
    document.getElementById('aecl').onclick = function(){modal.remove();};
    document.getElementById('aesv').onclick = function() {
      var apps=g(DB.a); var idx=apps.findIndex(function(a){return a.id===id;});
      var old=apps[idx].status, nw=document.getElementById('aes').value;
      apps[idx]=Object.assign({}, apps[idx], {note:document.getElementById('aen').value, status:nw});
      s(DB.a,apps);
      if(old==='wait'&&nw==='cancel'){retRem(apps[idx].visitor);toast('已取消返还','success');}
      modal.remove();
      if(document.getElementById('afl')) document.getElementById('alb').onclick();
      else if(document.getElementById('ab')) document.getElementById('ab').onclick();
    };
  };

  window._af = function(id) {
    if(!confirm('标记完成？')) return;
    var apps=g(DB.a); var a=apps.find(function(x){return x.id===id;});
    if(a){a.status='finish';s(DB.a,apps);toast('已完成','success');}
    if(document.getElementById('afl')) document.getElementById('alb').onclick();
    else if(document.getElementById('ab')) document.getElementById('ab').onclick();
  };

  window._acx = function(id) {
    if(!confirm('确定取消？返还次数。')) return;
    var apps=g(DB.a); var a=apps.find(function(x){return x.id===id;});
    if(a&&a.status==='wait'){a.status='cancel';s(DB.a,apps);retRem(a.visitor);toast('已取消返还','success');}
    if(document.getElementById('afl')) document.getElementById('alb').onclick();
    else if(document.getElementById('ab')) document.getElementById('ab').onclick();
  };

  // 启动
  init(); autoDone();
  var currentUser = getCur();
  if(currentUser) {
    if(currentUser.role === 'visitor') renderVisitor();
    else if(currentUser.role === 'consultant') renderConsultant();
    else if(currentUser.role === 'admin') renderAdmin();
  } else { renderLogin(); }
})();
</script>
</body>
</html>
