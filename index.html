<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>心理咨询预约系统 · 最终美化版</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%);
      display: flex; justify-content: center; align-items: flex-start;
      min-height: 100vh; padding: 16px; -webkit-tap-highlight-color: transparent;
    }
    .app-container {
      width: 100%; max-width: 540px; background: #ffffff; border-radius: 32px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.06); padding: 24px 20px;
      display: flex; flex-direction: column; gap: 20px; margin: 10px 0;
    }
    h2 { font-size: 1.7rem; font-weight: 650; color: #0f172a; }
    h3 { font-size: 1.1rem; font-weight: 600; color: #334155; margin-bottom: 8px; }
    .role-badge {
      font-size: 0.85rem; background: linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 100%);
      color: #3730a3; padding: 6px 14px; border-radius: 20px; font-weight: 500;
    }
    button {
      font-family: inherit; font-size: 16px; min-height: 48px; border-radius: 14px;
      padding: 12px 20px; width: 100%; margin: 5px 0; font-weight: 600;
      cursor: pointer; border: none; transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    button:active { transform: scale(0.96); }
    .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
    .btn-danger { background: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }
    .btn-gray { background: #e5e7eb; color: #1f2937; border: 1px solid #d1d5db; }
    .btn-success { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; }
    .btn-sm { min-height: 36px; padding: 8px 14px; font-size: 14px; width: auto; }
    input, select, textarea {
      font-family: inherit; font-size: 16px; min-height: 48px; border-radius: 14px;
      border: 1.5px solid #e2e8f0; padding: 10px 16px; background: #f9fafb;
      width: 100%; margin: 5px 0; transition: all 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: #667eea; background: #ffffff;
    }

    /* ========== 自定义日期输入框 ========== */
    .custom-date-wrapper {
      position: relative;
      flex: 1;
      min-width: 120px;
    }
    .custom-date-wrapper input[type="date"] {
      color: transparent;
      cursor: pointer;
      position: relative;
      z-index: 1;
    }
    .custom-date-wrapper input[type="date"]:valid,
    .custom-date-wrapper input[type="date"]:focus {
      color: #1e293b;
    }
    .custom-date-wrapper input[type="date"]::-webkit-calendar-picker-indicator {
      position: absolute;
      right: 12px;
      z-index: 2;
      cursor: pointer;
    }
    /* 隐藏默认的日期文字占位 */
    .custom-date-wrapper input[type="date"]::-webkit-datetime-edit-text,
    .custom-date-wrapper input[type="date"]::-webkit-datetime-edit-month-field,
    .custom-date-wrapper input[type="date"]::-webkit-datetime-edit-day-field,
    .custom-date-wrapper input[type="date"]::-webkit-datetime-edit-year-field {
      color: transparent;
    }
    .custom-date-wrapper input[type="date"]:valid::-webkit-datetime-edit-text,
    .custom-date-wrapper input[type="date"]:valid::-webkit-datetime-edit-month-field,
    .custom-date-wrapper input[type="date"]:valid::-webkit-datetime-edit-day-field,
    .custom-date-wrapper input[type="date"]:valid::-webkit-datetime-edit-year-field,
    .custom-date-wrapper input[type="date"]:focus::-webkit-datetime-edit-text,
    .custom-date-wrapper input[type="date"]:focus::-webkit-datetime-edit-month-field,
    .custom-date-wrapper input[type="date"]:focus::-webkit-datetime-edit-day-field,
    .custom-date-wrapper input[type="date"]:focus::-webkit-datetime-edit-year-field {
      color: #1e293b;
    }
    .custom-date-placeholder {
      position: absolute;
      left: 40px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      font-size: 16px;
      pointer-events: none;
      z-index: 0;
      transition: opacity 0.2s;
      background: transparent;
      padding-right: 4px;
    }
    .custom-date-wrapper input[type="date"]:valid ~ .custom-date-placeholder,
    .custom-date-wrapper input[type="date"]:focus ~ .custom-date-placeholder {
      opacity: 0;
    }

    .card { background: #f8fafc; border-radius: 20px; padding: 18px; border: 1px solid #e9eef3; }
    .grid-list { display: flex; flex-direction: column; gap: 10px; max-height: 500px; overflow-y: auto; }
    .appointment-row {
      background: white; border-radius: 16px; padding: 14px 16px;
      border: 1px solid #e2e8f0; display: flex; flex-direction: column; gap: 8px;
    }
    .row-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .status-badge { font-size: 0.8rem; font-weight: 600; padding: 4px 12px; border-radius: 16px; white-space: nowrap; }
    .status-badge.wait { background: #dbeafe; color: #1e40af; }
    .status-badge.finish { background: #dcfce7; color: #166534; }
    .status-badge.cancel { background: #fee2e2; color: #991b1b; }
    .time-range { font-size: 0.85rem; color: #64748b; font-weight: 500; }
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-group button { flex: 1; min-width: 80px; }
    .inline-group { display: flex; gap: 8px; align-items: center; }
    .inline-group select { flex: 1; }
    .modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); display: flex; align-items: center;
      justify-content: center; z-index: 1000; backdrop-filter: blur(4px);
    }
    .modal-content {
      background: white; width: 92%; max-width: 440px; border-radius: 24px;
      padding: 24px; max-height: 85vh; overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      animation: modalIn 0.25s ease-out;
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.9) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .admin-table { background: white; border-radius: 16px; overflow: hidden; border: 1px solid #e2e8f0; }
    .table-header, .table-row {
      display: grid; grid-template-columns: 1.5fr 1fr 0.8fr 1.2fr;
      padding: 12px 10px; gap: 4px; font-size: 0.85rem; align-items: center;
    }
    .table-header { background: #f1f5f9; font-weight: 600; color: #475569; }
    .table-row { border-bottom: 1px solid #f1f5f9; }
    .section-divider { border-top: 2px dashed #e2e8f0; margin: 16px 0; padding-top: 16px; }
    .warning-text { color: #dc2626; font-size: 0.85rem; margin-top: 4px; }
    
    /* 筛选器样式 */
    .filter-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 6px; }
    .filter-row > * { flex: 1; min-width: 100px; }
    .filter-row-full { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 6px; }
    .filter-row-full > * { flex: 1; min-width: 100px; }
    
    .stat-badge {
      display: inline-block; padding: 2px 8px; border-radius: 10px;
      font-size: 0.75rem; font-weight: 600; margin-left: 4px;
    }
    .stat-wait { background: #dbeafe; color: #1e40af; }
    .stat-finish { background: #dcfce7; color: #166534; }
    .stat-cancel { background: #fee2e2; color: #991b1b; }

    /* 气泡提示 */
    .toast-container {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      z-index: 9999; display: flex; flex-direction: column; gap: 8px;
      pointer-events: none;
    }
    .toast {
      background: rgba(30, 41, 59, 0.92); color: white;
      padding: 12px 24px; border-radius: 25px; font-size: 0.9rem;
      font-weight: 500; text-align: center; white-space: nowrap;
      backdrop-filter: blur(10px); box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      animation: toastIn 0.4s ease-out, toastOut 0.4s ease-in 2s forwards;
      pointer-events: auto;
    }
    .toast.success { background: rgba(16, 185, 129, 0.92); }
    .toast.error { background: rgba(220, 38, 38, 0.92); }
    .toast.warning { background: rgba(245, 158, 11, 0.92); }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes toastOut {
      from { opacity: 1; transform: translateY(0); }
      to { opacity: 0; transform: translateY(-10px); }
    }

    .date-display { font-weight: 600; color: #1e293b; }
    .date-display .weekday { font-size: 0.8rem; color: #64748b; margin-left: 4px; }
  </style>
</head>
<body>
<div class="app-container" id="app"></div>
<div class="toast-container" id="toastContainer"></div>

<script>
  (function() {
    const DB = {
      users: 'psy_u_f3', consultants: 'psy_c_f3', appointments: 'psy_a_f3', 
      profiles: 'psy_p_f3', current: 'psy_cur_f3', draft: 'psy_draft_f3'
    };

    function showToast(message, type = '') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => { if(toast.parentNode) toast.remove(); }, 2500);
    }
    window.alert = function(msg) { showToast(msg, 'warning'); };

    function formatDateNice(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr + 'T00:00:00');
      const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
      const m = d.getMonth() + 1;
      const day = d.getDate();
      const wd = weekdays[d.getDay()];
      return `${m}月${day}日 <span class="weekday">${wd}</span>`;
    }

    function init() {
      if (!localStorage.getItem(DB.users)) localStorage.setItem(DB.users, JSON.stringify([
        { username: 'user1', password: '123456', remaining: 5 }
      ]));
      if (!localStorage.getItem(DB.consultants)) localStorage.setItem(DB.consultants, JSON.stringify([
        { id: 'c1', account: 'wang01', name: '王咨询师', intro: '情绪管理专家', password: '123456' },
        { id: 'c2', account: 'li01', name: '李咨询师', intro: '家庭关系咨询', password: '123456' },
        { id: 'c3', account: 'zhang01', name: '张咨询师', intro: '职业发展规划', password: '123456' }
      ]));
      if (!localStorage.getItem(DB.appointments)) localStorage.setItem(DB.appointments, JSON.stringify([]));
      if (!localStorage.getItem(DB.profiles)) localStorage.setItem(DB.profiles, JSON.stringify([]));
    }

    const g = (k) => JSON.parse(localStorage.getItem(k) || '[]');
    const s = (k, v) => localStorage.setItem(k, JSON.stringify(v));
    const today = () => new Date().toISOString().split('T')[0];
    const getCur = () => JSON.parse(localStorage.getItem(DB.current));
    const setCur = (u) => localStorage.setItem(DB.current, JSON.stringify(u));
    const logout = () => { localStorage.removeItem(DB.current); renderLogin(); };

    function saveDraft(data) { s(DB.draft, data); }
    function getDraft() { return JSON.parse(localStorage.getItem(DB.draft) || '{}'); }
    function clearDraft() { localStorage.removeItem(DB.draft); }

    function returnRemaining(username) {
      const users = g(DB.users); const user = users.find(u => u.username === username);
      if (user) { user.remaining += 1; s(DB.users, users); return true; }
      return false;
    }
    function deductRemaining(username) {
      const users = g(DB.users); const user = users.find(u => u.username === username);
      if (user && user.remaining > 0) { user.remaining -= 1; s(DB.users, users); return true; }
      return false;
    }

    function getTimeSlots(date) {
      const slots = []; const now = new Date(); const isToday = date === today();
      for (let h = 9; h < 20; h++) {
        for (let m = 0; m < 60; m += 30) {
          const time = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
          const endH = h + Math.floor((m+60)/60); const endM = (m+60)%60;
          const endTime = `${String(endH).padStart(2,'0')}:${String(endM).padStart(2,'0')}`;
          if (isToday && (h*60+m) <= (now.getHours()*60+now.getMinutes())) continue;
          slots.push({ value: time, label: `${time} - ${endTime}` });
        }
      }
      return slots;
    }

    function getEndTime(t) {
      const [h,m] = t.split(':').map(Number);
      const eh = h + Math.floor((m+60)/60); const em = (m+60)%60;
      return `${String(eh).padStart(2,'0')}:${String(em).padStart(2,'0')}`;
    }

    function conflict(cid, date, time, excludeId) {
      const [nh,nm] = time.split(':').map(Number); const ns = nh*60+nm; const ne = ns+60;
      return g(DB.appointments).some(a => {
        if (a.consultantId !== cid || a.date !== date || a.id === excludeId) return false;
        if (a.status === 'cancel' || a.status === 'finish') return false;
        const [eh,em] = a.time.split(':').map(Number); const es = eh*60+em; const ee = es+60;
        return ns < ee && ne > es;
      });
    }

    function autoComplete() {
      const apps = g(DB.appointments); const now = new Date(); const td = today(); let changed = false;
      const updated = apps.map(a => {
        if (a.status !== 'wait') return a;
        const [h] = a.time.split(':').map(Number); const endMin = (h+1)*60;
        if (a.date < td || (a.date === td && now.getHours()*60+now.getMinutes() >= endMin)) {
          changed = true; return { ...a, status: 'finish' };
        }
        return a;
      });
      if (changed) s(DB.appointments, updated);
    }

    function buildProfileOptions(profiles, selectedId = '') {
      let html = '<option value="">选择来访者档案（可选）</option>';
      profiles.forEach(p => {
        html += `<option value="${p.id}" ${p.id===selectedId?'selected':''}>${p.name} ${p.phone}</option>`;
      });
      html += '<option value="__new__" style="color:#667eea;font-weight:600;">➕ 新增档案...</option>';
      return html;
    }

    // ========== 登录 ==========
    function renderLogin() {
      appEl.innerHTML = `
        <div style="text-align:center;margin-top:20px;"><h2>🧠 心理咨询预约</h2><p style="color:#64748b;">全功能管理平台</p></div>
        <input id="lu" placeholder="用户名"><input id="lp" type="password" placeholder="密码">
        <button class="btn-primary" id="loginBtn">登 录</button>
        <p style="font-size:0.8rem;color:#94a3b8;text-align:center;margin-top:12px;">
          admin/admin123 | user1/123456 | wang01/123456
        </p>`;
      document.getElementById('loginBtn').onclick = () => {
        const u = document.getElementById('lu').value.trim(), p = document.getElementById('lp').value.trim();
        if (!u || !p) { showToast('请输入用户名和密码', 'warning'); return; }
        if (u === 'admin' && p === 'admin123') { setCur({role:'admin'}); renderAdmin(); return; }
        const c = g(DB.consultants).find(x => x.account === u && x.password === p);
        if (c) { setCur({role:'consultant', id:c.id, name:c.name}); renderConsultant(); return; }
        const usr = g(DB.users).find(x => x.username === u && x.password === p);
        if (usr) { setCur({role:'visitor', username:usr.username}); renderVisitor(); return; }
        showToast('账号或密码错误', 'error');
      };
    }

    // ========== 来访者 ==========
    function renderVisitor() {
      autoComplete(); const cur = getCur();
      const user = g(DB.users).find(u => u.username === cur.username);
      if (!user) { logout(); return; }
      const profiles = g(DB.profiles).filter(p => p.owner === cur.username);
      const myApps = g(DB.appointments).filter(a => a.visitor === cur.username);
      const draft = getDraft();
      const savedDate = draft.date || today();
      const savedConsultant = draft.consultantId || '';
      const savedTime = draft.time || '';
      const savedNote = draft.note || '';
      const savedProfileId = draft.profileId || (profiles.length === 1 ? profiles[0].id : '');
      
      appEl.innerHTML = `
        <div style="display:flex;justify-content:space-between;"><h2>📅 我的预约</h2><span class="role-badge">剩余${user.remaining}次</span></div>
        <div class="card"><h3>新建预约</h3>
          <input type="date" id="ad" min="${today()}" value="${savedDate}">
          <select id="at"><option>选时段</option>${getTimeSlots(savedDate).map(s=>`<option value="${s.value}" ${s.value===savedTime?'selected':''}>${s.label}</option>`).join('')}</select>
          <select id="ac"><option>选咨询师</option>${g(DB.consultants).map(c=>`<option value="${c.id}" ${c.id===savedConsultant?'selected':''}>${c.name}</option>`).join('')}</select>
          <div class="inline-group"><select id="ap" style="flex:1;">${buildProfileOptions(profiles, savedProfileId)}</select></div>
          <textarea id="an" placeholder="备注" rows="2">${savedNote}</textarea>
          <button class="btn-primary" id="submit" ${user.remaining<=0?'disabled':''}>${user.remaining<=0?'次数用完':'✅ 确认预约'}</button>
        </div>
        <h3>待咨询</h3><div id="waitList" class="grid-list"></div>
        <div class="btn-group"><button class="btn-gray" id="recBtn">记录</button><button class="btn-gray" id="profBtn">档案</button><button class="btn-gray" id="ctrBtn">个人</button></div>
        <button class="btn-danger" id="outBtn">退出</button>`;
      
      function saveCurrentDraft() {
        const d = { date: document.getElementById('ad')?.value || '', time: document.getElementById('at')?.value || '', consultantId: document.getElementById('ac')?.value || '', profileId: document.getElementById('ap')?.value || '', note: document.getElementById('an')?.value || '' };
        if (d.profileId === '__new__') d.profileId = '';
        saveDraft(d);
      }
      document.getElementById('ad').onchange = function() { document.getElementById('at').innerHTML = '<option>选时段</option>'+getTimeSlots(this.value).map(x=>`<option value="${x.value}">${x.label}</option>`).join(''); saveCurrentDraft(); };
      document.getElementById('at').onchange = saveCurrentDraft;
      document.getElementById('ac').onchange = saveCurrentDraft;
      document.getElementById('an').oninput = saveCurrentDraft;
      document.getElementById('ap').onchange = function() { if (this.value === '__new__') { saveCurrentDraft(); renderProfileManager(); } else saveCurrentDraft(); };
      
      function showWait() {
        const w = myApps.filter(a=>a.status==='wait');
        document.getElementById('waitList').innerHTML = w.length===0?'<p style="color:#94a3b8;text-align:center;padding:20px;">暂无</p>':w.map(a=>{
          const c = g(DB.consultants).find(x=>x.id===a.consultantId);
          return `<div class="appointment-row"><div class="row-top"><div><span class="date-display">${formatDateNice(a.date)}</span><div class="time-range">${a.time}-${getEndTime(a.time)}</div></div><span class="status-badge wait">待咨询</span></div><div>${c?.name} | ${a.profileName||''}</div><button class="btn-gray" onclick="reschedule('${a.id}')">✏️ 改签</button></div>`;
        }).join('');
      }
      showWait();
      
      document.getElementById('submit').onclick = () => {
        const d=document.getElementById('ad').value, t=document.getElementById('at').value, cid=document.getElementById('ac').value, pid=document.getElementById('ap').value, note=document.getElementById('an').value;
        if(!d||!t||!cid) { showToast('请填写完整', 'warning'); return; }
        if(pid==='__new__') { showToast('请先选择档案', 'warning'); return; }
        if(conflict(cid,d,t)) { showToast('时段冲突', 'error'); return; }
        const p = profiles.find(x=>x.id===pid);
        const apps = g(DB.appointments); apps.push({id:Date.now().toString(),visitor:cur.username,consultantId:cid,date:d,time:t,profileName:p?`${p.name} ${p.phone}`:'',note,status:'wait'});
        s(DB.appointments,apps); deductRemaining(cur.username); clearDraft();
        showToast('预约创建成功！', 'success'); renderVisitor();
      };
      document.getElementById('recBtn').onclick = ()=>{
        const apps = g(DB.appointments).filter(a=>a.visitor===cur.username);
        appEl.innerHTML = `<h2>📋 记录</h2><div class="grid-list">${apps.map(a=>{const c=g(DB.consultants).find(x=>x.id===a.consultantId);return `<div class="appointment-row"><div class="row-top"><div><span class="date-display">${formatDateNice(a.date)}</span><div class="time-range">${a.time}-${getEndTime(a.time)}</div></div><span class="status-badge ${a.status}">${a.status==='wait'?'待':a.status==='finish'?'完':'取消'}</span></div><div>${c?.name} | ${a.profileName||''}</div>${a.status==='wait'?`<button class="btn-danger" onclick="cancelApp('${a.id}')">取消(返还)</button>`:''}</div>`;}).join('')}</div><button class="btn-gray" id="back">←返回</button>`;
        document.getElementById('back').onclick = renderVisitor;
      };
      document.getElementById('profBtn').onclick = () => { saveCurrentDraft(); renderProfileManager(); };
      document.getElementById('ctrBtn').onclick = ()=>{appEl.innerHTML=`<h2>⚙️ 个人</h2><div class="card"><p>${user.username} 剩余${user.remaining}次</p></div><button class="btn-primary" id="chPwd">修改密码</button><button class="btn-gray" id="back">←返回</button>`;document.getElementById('chPwd').onclick=()=>{const old=prompt('旧密码');if(old!==user.password){showToast('旧密码错误','error');return;}const n1=prompt('新密码(≥4位)');if(!n1||n1.length<4){showToast('至少4位','warning');return;}const users=g(DB.users);users.find(u=>u.username===cur.username).password=n1;s(DB.users,users);showToast('修改成功','success');logout();};document.getElementById('back').onclick=renderVisitor;};
      document.getElementById('outBtn').onclick = () => { clearDraft(); logout(); };
    }

    function renderProfileManager() {
      const cur = getCur();

    window.reschedule = function(id) {
      const app = g(DB.appointments).find(a=>a.id===id); if(!app) return;

      const modal = document.createElement('div'); modal.className='modal';
      modal.innerHTML = `<div class="modal-content"><h3>改签</h3><input type="date" id="rd" value="${app.date}" min="${today()}"><select id="rt">${getTimeSlots(app.date).map(s=>`<option value="${s.value}" ${s.value===app.time?'selected':''}>${s.label}</option>`).join('')}</select><select id="rc">${g(DB.consultants).map(c=>`<option value="${c.id}" ${c.id===app.consultantId?'selected':''}>${c.name}</option>`).join('')}</select><select id="rp">${buildProfileOptions(profiles)}</select><textarea id="rn">${app.note||''}</textarea><div class="btn-group"><button class="btn-primary" id="sv">保存</button><button class="btn-gray" id="cl">取消</button></div></div>`;
      document.body.appendChild(modal);

      document.getElementById('rp').onchange = function(){ if(this.value==='__new__'){modal.remove(); renderProfileManager();} };
      document.getElementById('cl').onclick = ()=>modal.remove();
      document.getElementById('sv').onclick = ()=>{
        const nd=document.getElementById('rd').value, nt=document.getElementById('rt').value, nc=document.getElementById('rc').value, np=document.getElementById('rp').value;
        if(!nd||!nt||!nc) { showToast('填写完整', 'warning'); return; }
        if(np==='__new__') { showToast('选择档案', 'warning'); return; }
        if(conflict(nc,nd,nt,id)) { showToast('冲突', 'error'); return; }
        const profile = profiles.find(x=>x.id===np);
        const apps=g(DB.appointments); const idx=apps.findIndex(a=>a.id===id);
        apps[idx]={...apps[idx],date:nd,time:nt,consultantId:nc,profileName:profile?`${profile.name} ${profile.phone}`:'',note:document.getElementById('rn').value};
        s(DB.appointments,apps); modal.remove(); showToast('改签成功', 'success'); renderVisitor();
      };
    };

            if (this.value) {

              const c=allCons.find(x=>x.id===a.consultantId);
              return `<div class="appointment-row">
                <div class="row-top"><div><span class="date-display">${formatDateNice(a.date)}</span><div class="time-range">${a.time}-${getEndTime(a.time)}</div></div><span class="status-badge ${a.status}">${a.status==='wait'?'待':a.status==='finish'?'完':'取消'}</span></div>
                <div>来访者: ${a.visitor} | 咨询师: ${c?.name||'未知'} | ${a.profileName||''}</div>
                ${a.note?`<div style="color:#64748b;">备注: ${a.note}</div>`:''}
                <div class="btn-group"><button class="btn-gray btn-sm" onclick="adminEditApp('${a.id}')">✏️ 编辑</button>${a.status==='wait'?`<button class="btn-primary btn-sm" onclick="adminFinish('${a.id}')">✅ 完成</button><button class="btn-danger btn-sm" onclick="adminCancelApp('${a.id}')">❌ 取消</button>`:''}</div>
              </div>`;
            }).join('');
        }
        
        document.getElementById('afUser').onchange = refreshFiltered;
        document.getElementById('afCons').onchange = refreshFiltered;
        document.getElementById('afStatus').onchange = refreshFiltered;
        document.getElementById('afDateFrom').onchange = refreshFiltered;
        document.getElementById('afDateTo').onchange = refreshFiltered;
        
        document.getElementById('afReset').onclick = ()=>{
          document.getElementById('afUser').value='';
          document.getElementById('afCons').value='';
          document.getElementById('afStatus').value='';
          document.getElementById('afDateFrom').value='';
          document.getElementById('afDateTo').value='';
          document.querySelectorAll('.custom-date-placeholder').forEach(el => el.style.opacity = '1');
          refreshFiltered();
        };
        
        document.getElementById('afExport').onclick = ()=>{
          const data = getFilteredApps();
          const exportData = data.map(a=>{
            const c=allCons.find(x=>x.id===a.consultantId);
            return {'日期':a.date,'时段':`${a.time}-${getEndTime(a.time)}`,'来访者':a.visitor,'咨询师':c?.name||'未知','档案':a.profileName||'','状态':a.status==='wait'?'待咨询':a.status==='finish'?'已完成':'已取消','备注':a.note||''};
          });
          const ws = XLSX.utils.json_to_sheet(exportData);
          const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'全部预约');
          XLSX.writeFile(wb,`全部预约_${today()}.xlsx`);
          showToast('导出成功', 'success');
        };
        
        refreshFiltered();
        document.getElementById('back').onclick = renderAdmin;
      };
      
      document.getElementById('outBtn').onclick = logout;
    }

    // 弹窗编辑
    window.editUserModal = function(un) {
      const u = g(DB.users).find(x=>x.username===un); if(!u) return;
      const modal = document.createElement('div'); modal.className='modal';
      modal.innerHTML = `<div class="modal-content"><h3>编辑: ${un}</h3><p>密码</p><input id="euPass" value="${u.password}"><p>次数</p><input id="euTimes" type="number" value="${u.remaining}" min="0"><div class="btn-group"><button class="btn-primary" id="euSave">保存</button><button class="btn-gray" id="euCancel">取消</button></div></div>`;
      document.body.appendChild(modal);
      document.getElementById('euCancel').onclick = ()=>modal.remove();
      document.getElementById('euSave').onclick = ()=>{const np=document.getElementById('euPass').value,nt=parseInt(document.getElementById('euTimes').value)||0;const users=g(DB.users);const user=users.find(x=>x.username===un);user.password=np;user.remaining=nt;s(DB.users,users);modal.remove();showToast('修改成功','success');document.getElementById('userBtn')?.onclick();};
    };
    window.editUser = function(un) { window.editUserModal(un); };
    window.delUser = function(un) { if(!confirm(`删除${un}？`)) return; s(DB.users, g(DB.users).filter(u=>u.username!==un)); showToast('已删除','success'); renderAdmin(); };

    window.editConsModal = function(id) {
      const c = g(DB.consultants).find(x=>x.id===id); if(!c) return;
      const modal = document.createElement('div'); modal.className='modal';
      modal.innerHTML = `<div class="modal-content"><h3>编辑咨询师</h3><p>账号</p><input id="ecAcc" value="${c.account}"><p>姓名</p><input id="ecName" value="${c.name}"><p>简介</p><input id="ecIntro" value="${c.intro||''}"><p>密码</p><input id="ecPass" value="${c.password}"><div class="btn-group"><button class="btn-primary" id="ecSave">保存</button><button class="btn-gray" id="ecCancel">取消</button></div></div>`;
      document.body.appendChild(modal);
      document.getElementById('ecCancel').onclick = ()=>modal.remove();
      document.getElementById('ecSave').onclick = ()=>{const na=document.getElementById('ecAcc').value.trim(),nn=document.getElementById('ecName').value.trim();if(!na||!nn){showToast('不能为空','warning');return;}const cons=g(DB.consultants);if(cons.some(x=>x.account===na&&x.id!==id)){showToast('账号重复','error');return;}const con=cons.find(x=>x.id===id);con.account=na;con.name=nn;con.intro=document.getElementById('ecIntro').value;con.password=document.getElementById('ecPass').value;s(DB.consultants,cons);modal.remove();showToast('修改成功','success');document.getElementById('consBtn')?.onclick();};
    };
    window.editCons = function(id) { window.editConsModal(id); };
    window.delCons = function(id) { if(!confirm('删除？')) return; s(DB.consultants, g(DB.consultants).filter(c=>c.id!==id)); showToast('已删除','success'); renderAdmin(); };

    window.adminEditApp = function(id) {
      const app=g(DB.appointments).find(a=>a.id===id); if(!app) return;
      const modal=document.createElement('div'); modal.className='modal';
      modal.innerHTML = `<div class="modal-content"><h3>编辑预约</h3><p><span class="date-display">${formatDateNice(app.date)}</span> ${app.time}-${getEndTime(app.time)} | ${app.visitor}</p><textarea id="aeNote">${app.note||''}</textarea><select id="aeStatus"><option value="wait" ${app.status==='wait'?'selected':''}>待咨询</option><option value="finish" ${app.status==='finish'?'selected':''}>已完成</option><option value="cancel" ${app.status==='cancel'?'selected':''}>已取消</option></select><p class="warning-text">⚠️ 取消返还1次</p><div class="btn-group"><button class="btn-primary" id="aeSave">保存</button><button class="btn-gray" id="aeCancel">取消</button></div></div>`;
      document.body.appendChild(modal);
      document.getElementById('aeCancel').onclick = ()=>modal.remove();
      document.getElementById('aeSave').onclick = ()=>{const apps=g(DB.appointments);const idx=apps.findIndex(a=>a.id===id);const old=apps[idx].status,nw=document.getElementById('aeStatus').value;apps[idx]={...apps[idx],note:document.getElementById('aeNote').value,status:nw};s(DB.appointments,apps);if(old==='wait'&&nw==='cancel'){returnRemaining(apps[idx].visitor);showToast('已取消返还','success');}modal.remove();if(document.getElementById('afList'))document.getElementById('allBtn').onclick();else document.getElementById('apptBtn')?.onclick();};
    };
    window.adminFinish = function(id) { if(!confirm('标记完成？')) return; const apps=g(DB.appointments); const a=apps.find(x=>x.id===id); if(a){a.status='finish';s(DB.appointments,apps);showToast('已完成','success');} if(document.getElementById('afList'))document.getElementById('allBtn').onclick();else document.getElementById('apptBtn')?.onclick(); };
    window.adminCancelApp = function(id) { if(!confirm('确定取消？\n\n✅ 将自动返还来访者1次预约次数')) return; const apps=g(DB.appointments); const a=apps.find(x=>x.id===id); if(a&&a.status==='wait'){a.status='cancel';s(DB.appointments,apps);returnRemaining(a.visitor);showToast('已取消返还','success');} if(document.getElementById('afList'))document.getElementById('allBtn').onclick();else document.getElementById('apptBtn')?.onclick(); };

    // ========== 启动 ==========
    const appEl = document.getElementById('app');
    init(); autoComplete();
    const cur = getCur();
    if (cur) {
      if (cur.role === 'visitor') renderVisitor();
      else if (cur.role === 'consultant') renderConsultant();
      else if (cur.role === 'admin') renderAdmin();
    } else { renderLogin(); }
  })();
</script>
</body>
</html>
